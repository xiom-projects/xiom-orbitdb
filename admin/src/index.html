<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBITDB Admin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
         background: #0e1116; color: #d7dde8; }
  header { padding: 14px 20px; border-bottom: 1px solid #253041; background: #121722;
           display: flex; align-items: baseline; gap: 14px; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .04em; color: #8ab4ff; }
  .muted { color: #7d8aa0; }
  main { padding: 18px 20px 40px; max-width: 1180px; }
  section { margin-bottom: 22px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
       color: #7d8aa0; margin: 0 0 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
           gap: 8px; }
  .card { border: 1px solid #253041; border-radius: 6px; padding: 9px 11px;
          background: #121722; }
  .card .k { color: #7d8aa0; font-size: 11px; text-transform: uppercase;
             letter-spacing: .06em; }
  .card .v { font-size: 15px; color: #e8eef8; overflow-wrap: anywhere; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 10px; }
  label { display: flex; flex-direction: column; gap: 3px; color: #7d8aa0; font-size: 11px; }
  input { background: #0b0f15; color: #d7dde8; border: 1px solid #2c3a4e;
          border-radius: 5px; padding: 6px 8px; font: inherit; width: 130px; }
  button { background: #1f3b66; color: #dbe7ff; border: 1px solid #2f5a99;
           border-radius: 5px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover { background: #284a7d; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid #1d2635; }
  th { color: #7d8aa0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: #66d19e; } .bad { color: #ff7b72; }
  #err { color: #ff7b72; margin-left: 10px; }
  code { color: #8ab4ff; }
</style>
</head>
<body>
<header>
  <h1>ORBITDB ADMIN</h1>
  <span class="muted" id="sub">local control plane &middot; read-only</span>
  <span id="err"></span>
</header>
<main>
  <section>
    <h2>Engine status</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section>
    <h2>Key range</h2>
    <div class="row">
      <label>low <input id="low" type="number" value="0"></label>
      <label>high <input id="high" type="number" value="200"></label>
      <label>limit <input id="limit" type="number" value="100"></label>
      <button id="load">Load</button>
      <span class="muted" id="rangeInfo"></span>
    </div>
    <table>
      <thead><tr><th>key</th><th>value</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <section>
    <h2>Point lookup</h2>
    <div class="row">
      <label>key <input id="key" type="number" value="1"></label>
      <button id="get">Get</button>
      <span id="getOut" class="muted"></span>
    </div>
  </section>

  <section>
    <h2>Write (token required)</h2>
    <div class="row">
      <label style="width:220px">admin token <input id="token" type="password"
        placeholder="ORBITDB_ADMIN_TOKEN" style="width:220px"></label>
      <label>key <input id="wkey" type="number" value="41"></label>
      <label>value <input id="wval" type="number" value="410"></label>
      <button id="put">Put</button>
      <button id="del">Delete</button>
      <button id="ckpt">Checkpoint</button>
    </div>
    <div class="muted">Writes are refused unless the server was started with
      <code>ORBITDB_ADMIN_TOKEN</code>; send that value in the token box.</div>
    <div id="wout" class="muted"></div>
  </section>

  <section>
    <h2>Links</h2>
    <div class="muted">APIs:
      <a href="/api/status">/api/status</a> &middot;
      <a href="/api/range?low=0&amp;high=200&amp;limit=100">/api/range</a> &middot;
      <a href="/api/get?key=1">/api/get</a>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const tok = () => sessionStorage.getItem("orbitdb-admin-token") || "";
const hdrs = () => { const t = tok(); return t ? { "X-Admin-Token": t } : {}; };
const cards = [
  ["path", "path"], ["keys", "keys"], ["size", "size"], ["order", "order"],
  ["page format", "page_format"], ["durability", "durability"],
  ["wal bytes", "wal_bytes"], ["last lsn", "last_lsn"],
  ["snapshot gen", "snap_generation"], ["pins", "pins"],
  ["compaction deferred", "compaction_deferrals"], ["paged", "paged"],
  ["nodes", "nodes"], ["cache frames", "cache_capacity"],
  ["blocks", "block_count"], ["pager hits", "pager_hits"],
  ["pager misses", "pager_misses"], ["evictions", "pager_evictions"],
  ["spills", "pager_spills"], ["corrupt", "pager_corrupt"]
];
function esc(v) { return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
async function refresh() {
  try {
    const r = await fetch("/api/status", { cache: "no-store", headers: hdrs() });
    if (!r.ok) { $("err").textContent = "status HTTP " + r.status + (r.status === 401 ? " — enter the admin token" : ""); return; }
    const s = await r.json();
    $("cards").innerHTML = cards.map(([label, k]) => {
      let v = s[k];
      if (k === "failed" || k === "paged") v = v ? "yes" : "no";
      return `<div class="card"><div class="k">${label}</div><div class="v">${esc(v)}</div></div>`;
    }).join("");
    $("sub").textContent = s.path + "  ·  " + s.keys + " keys  ·  gen " + s.snap_generation;
    $("err").textContent = s.failed ? "engine latched failed — reopen" : "";
    $("err").className = s.failed ? "bad" : "";
  } catch (e) { $("err").textContent = "status error: " + e; }
}
async function loadRange() {
  const q = new URLSearchParams({ low: $("low").value, high: $("high").value, limit: $("limit").value });
  const r = await fetch("/api/range?" + q, { cache: "no-store", headers: hdrs() });
  if (!r.ok) { $("err").textContent = "range HTTP " + r.status; return; }
  const d = await r.json();
  if (!r.ok) { $("err").textContent = d.error || "range error"; return; }
  $("err").textContent = "";
  $("rows").innerHTML = d.keys.map((k, i) =>
    `<tr><td class="num">${k}</td><td class="num">${d.values[i]}</td></tr>`).join("");
  $("rangeInfo").textContent = d.keys.length + " row(s) of " + d.total + " in range";
}
async function getKey() {
  const r = await fetch("/api/get?key=" + encodeURIComponent($("key").value), { cache: "no-store", headers: hdrs() });
  if (!r.ok) { $("getOut").textContent = "HTTP " + r.status; $("getOut").className = "bad"; return; }
  const d = await r.json();
  $("getOut").textContent = d.found ? ("value = " + d.value) : "not found";
  $("getOut").className = d.found ? "ok" : "muted";
}
async function callWrite(path) {
  const r = await fetch(path, { method: "POST", cache: "no-store", headers: hdrs() });
  const t = await r.text();
  $("wout").textContent = "HTTP " + r.status + "  " + t;
  $("wout").className = r.ok ? "ok" : "bad";
  refresh(); loadRange();
}
$("load").addEventListener("click", loadRange);
$("get").addEventListener("click", getKey);
$("put").addEventListener("click", () => callWrite("/api/put?key=" + encodeURIComponent($("wkey").value) + "&value=" + encodeURIComponent($("wval").value)));
$("del").addEventListener("click", () => callWrite("/api/delete?key=" + encodeURIComponent($("wkey").value)));
$("ckpt").addEventListener("click", () => callWrite("/api/checkpoint"));
const tin = $("token");
tin.value = tok();
tin.addEventListener("change", () => { sessionStorage.setItem("orbitdb-admin-token", tin.value); refresh(); loadRange(); });
loadRange(); refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
