# XIOM ORBITDB consumer probe project -- xiom.wal 0.1.0 from the registry.
#
# The compiler resolves a probe's imports against the NEAREST project
# manifest walking up from the entry file; for tests/pkg/*.xi this file is
# that manifest:
#   - `.`         the probe module itself
#   - ../../src   ORBITDB src (xiom.db.*), for the two-way format interop
#   - the registry dependency xiom-wal 0.1.0 (installed under xiom_home,
#     mapped to its src root by the v0.64.2 registry dependency resolver)
# Runner: scripts/run.ps1 tests\pkg\probe_pkg_wal.xi -TimeoutSec 180
#         scripts/run.sh tests/pkg/probe_pkg_wal.xi --timeout-sec 180
[project]
name = "orbitdb-pkg-probe"
version = "0.0.0"
root = "."
source-roots = [
  "../../src",
]

[dependencies]
xiom-wal = "0.1.0"
